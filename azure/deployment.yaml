# Manifesto Kubernetes para deploy de módulos migrados no AKS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: $(MODULE_NAME)-svc
  namespace: migration
  labels:
    app: $(MODULE_NAME)-svc
    version: $(IMAGE_TAG)
    migrated-from: mainframe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: $(MODULE_NAME)-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: $(MODULE_NAME)-svc
        version: $(IMAGE_TAG)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: migration-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: $(MODULE_NAME)-svc
          image: $(ACR_LOGIN_SERVER)/$(MODULE_NAME):$(IMAGE_TAG)
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: azure
            - name: APPLICATION_INSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: migration-secrets
                  key: appinsights-connection-string
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: $(MODULE_NAME)-svc
  namespace: migration
  labels:
    app: $(MODULE_NAME)-svc
spec:
  selector:
    app: $(MODULE_NAME)-svc
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-sa
  namespace: migration
  annotations:
    azure.workload.identity/client-id: $(AZURE_CLIENT_ID)
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: $(MODULE_NAME)-pdb
  namespace: migration
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: $(MODULE_NAME)-svc
